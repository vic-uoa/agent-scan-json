interface:
  display_name: "智能体 JSON 工作流安全扫描"
  short_description: "静态扫描内部 JSON 智能体工作流并生成可审计中文安全报告"
  default_prompt: "使用 $agent-json-workflow-security-scan 扫描这个内部 JSON 工作流。必须调用 skill 内的 scripts/scan_workflow.py，最终仅交付按工作流文件名命名的自包含中文 HTML 安全报告；不得用 Markdown 聊天文本替代报告，也不得落盘中间文件。"
policy:
  allow_implicit_invocation: true

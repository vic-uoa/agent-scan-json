schema_version: 1.0.0
rules:
  - {id: FLOW-001, title: 图结构不完整或节点标识冲突, severity: HIGH, detectability: S, control_domain: structure_coverage, standards: ["AISVS v1.0-C9", "CWE-20"], dynamic_test: null}
  - {id: FLOW-002, title: 未知节点形成扫描覆盖缺口, severity: MEDIUM, detectability: S, control_domain: structure_coverage, standards: ["AISVS v1.0-C9"], dynamic_test: null}
  - {id: FLOW-003, title: 变量引用缺失或无法唯一解析, severity: MEDIUM, detectability: S, control_domain: data_contract, standards: ["AISVS v1.0-C9", "CWE-20"], dynamic_test: null}
  - {id: FLOW-004, title: 不可信数据直达高影响能力, severity: HIGH, detectability: S, control_domain: action_authorization, standards: ["ASI02:2026", "AISVS v1.0-C9"], dynamic_test: source_to_high_impact_sink}
  - {id: FLOW-005, title: 知识或外部内容形成间接注入链, severity: HIGH, detectability: H, control_domain: untrusted_content_boundary, standards: ["ASI01:2026", "LLM01:2025", "MITRE ATLAS AML.T0051"], dynamic_test: rag_to_tool_injection}
  - {id: FLOW-006, title: 条件分支可绕过动作控制, severity: HIGH, detectability: S, control_domain: action_authorization, standards: ["ASI02:2026", "AISVS v1.0-C9"], dynamic_test: branch_bypass}
  - {id: FLOW-007, title: 循环终止与资源边界不可验证, severity: MEDIUM, detectability: S, control_domain: resilience_budget, standards: ["LLM10:2025", "AISVS v1.0-C9"], dynamic_test: runaway_loop}
  - {id: FLOW-008, title: 敏感数据可达外部边界, severity: HIGH, detectability: H, control_domain: data_protection, standards: ["LLM02:2025", "AISVS v1.0-C7", "ASVS 5.0 V14"], dynamic_test: sensitive_data_exfiltration}
  - {id: FLOW-009, title: 模型自由文本可控制执行能力, severity: HIGH, detectability: S, control_domain: structured_data_contract, standards: ["LLM05:2025", "ASI02:2026"], dynamic_test: free_text_tool_control}
  - {id: FLOW-010, title: 多个副作用能力缺少故障隔离, severity: HIGH, detectability: H, control_domain: resilience_budget, standards: ["ASI08:2026", "AISVS v1.0-C9"], dynamic_test: cascading_failure}
  - {id: FLOW-011, title: 子工作流信任边界不完整, severity: MEDIUM, detectability: H, control_domain: workflow_boundary, standards: ["ASI07:2026", "AISVS v1.0-C9"], dynamic_test: subworkflow_contract}
  - {id: FLOW-012, title: 自主 Agent 缺少目标与停止边界, severity: HIGH, detectability: H, control_domain: agent_governance, standards: ["ASI10:2026", "AISVS v1.0-C9"], dynamic_test: rogue_agent_containment}
  - {id: FLOW-013, title: 节点不在可执行入口到输出路径上, severity: LOW, detectability: S, control_domain: structure_coverage, standards: ["AISVS v1.0-C9"], dynamic_test: null}
  - {id: FLOW-014, title: 条件分支与边句柄契约不一致, severity: MEDIUM, detectability: S, control_domain: data_contract, standards: ["AISVS v1.0-C9", "CWE-670"], dynamic_test: branch_bypass}
  - {id: FLOW-015, title: 历史上下文隔离与保留策略不可验证, severity: MEDIUM, detectability: M, control_domain: data_protection, standards: ["AISVS v1.0-C8", "ASI06:2026"], dynamic_test: memory_context_isolation}
  - {id: FLOW-016, title: 循环子图入口输出或边界契约不完整, severity: MEDIUM, detectability: S, control_domain: data_contract, standards: ["AISVS v1.0-C9"], dynamic_test: runaway_loop}

  - {id: IN-001, title: 输入缺少明确类型或对象 Schema, severity: MEDIUM, detectability: S, control_domain: input_contract, standards: ["AISVS v1.0-C2", "ASVS 5.0 V2"], dynamic_test: input_schema}
  - {id: IN-002, title: 输入缺少长度数量或枚举边界, severity: LOW, detectability: S, control_domain: input_contract, report_group: hardening, standards: ["AISVS v1.0-C2.1", "LLM10:2025"], dynamic_test: input_boundary}
  - {id: IN-003, title: 文件输入缺少类型数量或大小约束, severity: HIGH, detectability: S, control_domain: input_contract, standards: ["AISVS v1.0-C2", "ASVS 5.0 V5"], dynamic_test: malicious_file_upload}
  - {id: IN-004, title: 用户输入进入模型指令边界, severity: LOW, detectability: S, control_domain: instruction_boundary, standards: ["AISVS v1.0-C2.1", "LLM01:2025"], dynamic_test: direct_prompt_injection}
  - {id: IN-005, title: 敏感输入缺少数据处理约束, severity: MEDIUM, detectability: H, control_domain: data_protection, standards: ["LLM02:2025", "AISVS v1.0-C7"], dynamic_test: sensitive_input_propagation}

  - {id: LLM-001, title: Prompt 未区分可信指令与不可信数据, severity: LOW, detectability: H, control_domain: instruction_boundary, standards: ["AISVS v1.0-C2.1.6", "LLM01:2025", "ASI01:2026"], dynamic_test: instruction_data_boundary}
  - {id: LLM-002, title: Prompt 或模型配置包含疑似密钥, severity: HIGH, detectability: S, control_domain: data_protection, standards: ["LLM02:2025", "CWE-798"], dynamic_test: prompt_secret_leakage}
  - {id: LLM-003, title: 机器消费的模型输出缺少结构化契约, severity: HIGH, detectability: S, control_domain: structured_data_contract, standards: ["LLM05:2025", "AISVS v1.0-C7"], dynamic_test: structured_output_contract}
  - {id: LLM-004, title: 模型令牌或迭代预算不可验证, severity: MEDIUM, detectability: S, control_domain: resilience_budget, standards: ["LLM10:2025", "AISVS v1.0-C9"], dynamic_test: resource_budget}
  - {id: LLM-005, title: 模型失败回退策略不可验证, severity: MEDIUM, detectability: H, control_domain: resilience_budget, standards: ["ASI08:2026", "AISVS v1.0-C7"], dynamic_test: model_failure}
  - {id: LLM-006, title: 模型输出参与安全或授权分支决策, severity: HIGH, detectability: H, control_domain: action_authorization, standards: ["ASI03:2026", "AISVS v1.0-C9"], dynamic_test: model_authorization_decision}
  - {id: LLM-007, title: 模型服务端点传输或固定策略观察, severity: MEDIUM, detectability: S, control_domain: egress_control, report_group: posture, standards: ["AISVS v1.0-C4", "ASVS 5.0 V9", "CWE-319"], dynamic_test: model_endpoint_security}

  - {id: TOOL-001, title: 工具能力或副作用无法确定, severity: MEDIUM, detectability: H, control_domain: tool_contract, standards: ["ASI02:2026", "AISVS v1.0-C9"], dynamic_test: unknown_tool_capability}
  - {id: TOOL-002, title: 高影响工具参数可由不可信数据控制, severity: HIGH, detectability: S, control_domain: action_authorization, standards: ["ASI02:2026", "ASI03:2026", "CWE-20"], dynamic_test: controllable_tool_argument}
  - {id: TOOL-003, title: 动态网络目标形成 SSRF 风险, severity: HIGH, detectability: S, control_domain: egress_control, standards: ["ASVS 5.0 V1.3.6", "CWE-918"], dynamic_test: ssrf}
  - {id: TOOL-004, title: 代码节点包含危险执行或网络原语, severity: CRITICAL, detectability: S, control_domain: execution_boundary, standards: ["ASI05:2026", "CWE-94", "CWE-78"], dynamic_test: unexpected_code_execution}
  - {id: TOOL-005, title: 工具身份认证或对象授权不可验证, severity: HIGH, detectability: M, control_domain: identity_authorization, standards: ["ASI03:2026", "AISVS v1.0-C5", "ASVS 5.0 V8"], dynamic_test: authorization_bypass}
  - {id: TOOL-006, title: 工具输出缺少可验证 Schema, severity: MEDIUM, detectability: S, control_domain: structured_data_contract, standards: ["LLM05:2025", "AISVS v1.0-C9"], dynamic_test: tool_output_contract}
  - {id: TOOL-007, title: 外部调用超时重试和幂等策略不可验证, severity: MEDIUM, detectability: M, control_domain: resilience_budget, standards: ["ASI08:2026", "AISVS v1.0-C9"], dynamic_test: tool_timeout}
  - {id: TOOL-008, title: 工具或 MCP 供应链完整性不可验证, severity: HIGH, detectability: M, control_domain: supply_chain, standards: ["ASI04:2026", "AISVS v1.0-C6", "LLM03:2025"], dynamic_test: tool_supply_chain}
  - {id: TOOL-009, title: 不可信工具输出进入模型指令边界, severity: LOW, detectability: S, control_domain: instruction_boundary, standards: ["LLM01:2025", "ASI01:2026"], dynamic_test: tool_output_prompt_injection}
  - {id: TOOL-010, title: 高后果动作缺少确定性动作门, severity: HIGH, detectability: H, control_domain: action_authorization, standards: ["ASI02:2026", "AISVS v1.0-C9"], dynamic_test: action_gate_bypass}
  - {id: TOOL-011, title: 代码语言或语法无法完整静态分析, severity: MEDIUM, detectability: S, control_domain: execution_boundary, standards: ["ASI05:2026", "CWE-94"], dynamic_test: unexpected_code_execution}
  - {id: TOOL-012, title: 工具参数包含或可能暴露认证材料, severity: HIGH, detectability: S, control_domain: data_protection, standards: ["ASI03:2026", "LLM02:2025", "CWE-798"], dynamic_test: prompt_secret_leakage}

  - {id: OUT-001, title: 最终输出缺少或违反结构化契约, severity: HIGH, detectability: S, control_domain: output_contract, standards: ["LLM05:2025", "AISVS v1.0-C7"], dynamic_test: output_schema}
  - {id: OUT-002, title: 敏感信息可能通过输出披露, severity: HIGH, detectability: H, control_domain: data_protection, standards: ["LLM02:2025", "ASVS 5.0 V14"], dynamic_test: sensitive_output}
  - {id: OUT-003, title: 中间输出扩大上下文披露面, severity: MEDIUM, detectability: H, control_domain: data_protection, standards: ["LLM02:2025", "AISVS v1.0-C12"], dynamic_test: intermediate_output_disclosure}
  - {id: OUT-004, title: 富文本或链接输出净化不可验证, severity: MEDIUM, detectability: H, control_domain: output_safety, standards: ["LLM05:2025", "ASVS 5.0 V1"], dynamic_test: rich_text_injection}
  - {id: OUT-005, title: 知识型输出缺少来源引用, severity: MEDIUM, detectability: S, control_domain: knowledge_governance, standards: ["AISVS v1.0-C8", "LLM09:2025"], dynamic_test: citation_integrity}
  - {id: OUT-006, title: 输出字段 Schema 不完整或存在冲突, severity: MEDIUM, detectability: S, control_domain: output_contract, standards: ["LLM05:2025", "AISVS v1.0-C7", "CWE-20"], dynamic_test: output_schema}

  - {id: KB-001, title: 知识数据集范围可被动态控制, severity: HIGH, detectability: S, control_domain: knowledge_governance, standards: ["AISVS v1.0-C8", "LLM08:2025"], dynamic_test: dataset_scope}
  - {id: KB-002, title: 知识库租户与 ACL 边界不可验证, severity: HIGH, detectability: M, control_domain: knowledge_governance, standards: ["AISVS v1.0-C8", "ASI03:2026"], dynamic_test: cross_tenant_retrieval}
  - {id: KB-003, title: 知识内容进入模型指令边界, severity: LOW, detectability: H, control_domain: instruction_boundary, standards: ["LLM01:2025", "LLM08:2025", "ASI06:2026"], dynamic_test: rag_indirect_prompt_injection}
  - {id: KB-004, title: 知识来源元数据未随结果传播, severity: MEDIUM, detectability: S, control_domain: knowledge_governance, standards: ["AISVS v1.0-C8", "LLM09:2025"], dynamic_test: citation_integrity}
  - {id: KB-005, title: 检索数量或相关性阈值不可验证, severity: MEDIUM, detectability: S, control_domain: resilience_budget, standards: ["AISVS v1.0-C8", "LLM10:2025"], dynamic_test: retrieval_boundary}
  - {id: KB-006, title: 知识检索数据集或参数配置无效, severity: MEDIUM, detectability: S, control_domain: knowledge_governance, standards: ["AISVS v1.0-C8", "LLM08:2025", "CWE-20"], dynamic_test: dataset_scope}
